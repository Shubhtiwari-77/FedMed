services:
  - type: web
    name: fedmed-fl
    runtime: python
    plan: free
    buildCommand: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: >-
      python3 src/run_simulation.py &&
      streamlit run app/streamlit_app.py
      --server.headless true
      --server.address 0.0.0.0
      --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
