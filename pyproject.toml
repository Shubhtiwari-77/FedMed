[project]
name = "fedmed-fl"
version = "1.0.0"
description = "FedMed-FL clinical decision support app"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "flwr>=1.16,<2.0",
  "streamlit>=1.30",
]

[tool.vercel]
entrypoint = "vercel_app:main"
